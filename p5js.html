<body class="work-list-page" data-site-root="." data-site-section="p5js">
  
  <main class="work-list-main">
    <section class="work-list-intro">
      <h1 class="work-list-title">Creative Coding</h1>
      <p class="work-list-subtitle">Interactive and generative projects spanning identity systems, interfaces, and algorithmic image-making.</p>
    </section>
    <div id="loading" class="loading-state">Loading projects...</div>
    <section id="design-grid" class="work-list-rows">
      <noscript>
        <a class="work-row" href="p5js/p5js1.html"><div class="work-row-meta"><h2 class="work-row-title">Interactive Identity for X-Journal I</h2><p class="work-row-desc">Motion-led publication identity experiments built with p5.js and responsive visual behaviors.</p></div><div class="work-row-thumb"><img src="assets/img/p5x1/HEADER-(2).png" alt="Interactive X-Journal identity artwork"></div></a>
        <a class="work-row" href="p5js/interrupting-the-grid.html"><div class="work-row-meta"><h2 class="work-row-title">No Meaning Required</h2><p class="work-row-desc">Circles placed across a strict grid, driven by randomness without breaking the structure.</p></div><div class="work-row-thumb"><img src="assets/img/gen-art/circles/circle-grid-(0).png" alt="Generative circle grid artwork"></div></a>
        <a class="work-row" href="p5js/p5js3.html"><div class="work-row-meta"><h2 class="work-row-title">Interactive Identity for X-Journal II</h2><p class="work-row-desc">A second round of interactive identity studies extending the journal system into new visual logic.</p></div><div class="work-row-thumb"><img src="assets/img/p5x2/P5-HEADER.png" alt="Second interactive X-Journal identity artwork"></div></a>
        <a class="work-row" href="p5js/p5js4.html"><div class="work-row-meta"><h2 class="work-row-title">Hierarchy</h2><p class="work-row-desc">A particle system built from three random words: triangle, bright, and tired.</p></div><div class="work-row-thumb"><img src="assets/img/p5class/P5U-DISRUPT-(1).png" alt="Hierarchy particle system artwork"></div></a>
        <a class="work-row" href="p5js/photographing-particles.html"><div class="work-row-meta"><h2 class="work-row-title">Photographing Particles</h2><p class="work-row-desc">A particle-based generative system where cursor movement captures moments in motion for the plotter.</p></div><div class="work-row-thumb"><img src="assets/img/gen-art/particles/1.jpg" alt="Photographing Particles generative artwork"></div></a>
        <a class="work-row" href="p5js/senior-finals.html"><div class="work-row-meta"><h2 class="work-row-title">Senior Finals</h2><p class="work-row-desc">Plotter-driven generative compositions developed for a senior exhibition.</p></div><div class="work-row-thumb"><img src="assets/img/gen-art/senior-final/1267_001.png" alt="Senior Finals plotter artwork"></div></a>
      </noscript>
    </section>
  </main>

  <script src="assets/js/work-listings.js"></script>
  <script src="assets/js/site-header.js"></script>
  <script src="assets/js/header-dropdown.js"></script>
  
  <script>
    // Project slug mapping for URLs
    const projectSlugs = {
      'Interactive Identity for X-Journal I': 'p5js1',
      'Interactive Identity for X-Journal II': 'p5js3',
      'Hierarchy': 'p5js4',
      'No Meaning Required': 'interrupting-the-grid',
      'Photographing Particles': 'photographing-particles',
      'Senior Finals': 'senior-finals'
    };

    const projectDescriptions = {
      'Interactive Identity for X-Journal I': 'Motion-led publication identity experiments built with p5.js and responsive visual behaviors.',
      'Interactive Identity for X-Journal II': 'A second round of interactive identity studies extending the journal system into new visual logic.',
      'Hierarchy': 'A particle system built from three random words — triangle, bright, tired — about systems designed for you to never escape.',
      'No Meaning Required': 'Circles placed across a strict grid, their position and size driven by randomness, but never enough to break the structure holding them.',
      'Photographing Particles': 'A particle-based generative system where cursor movement and clicks capture moments in motion, then made permanent by the plotter.',
      'Senior Finals': 'Plotter-driven generative compositions developed for a senior exhibition.'
    };

    const projectImageOverrides = {
      'No Meaning Required': 'assets/img/gen-art/circles/circle-grid-(0).png'
    };

    const projectVideoOverrides = {
      'Interactive Identity for X-Journal I': 'assets/video/p5js1-thumbnail.mp4',
      'Interactive Identity for X-Journal II': 'assets/video/p5js3-thumbnail.mp4'
    };

    async function loadP5jsProjects() {
      try {
        const response = await fetch('p5js-projects-data.json');
        if (!response.ok) throw new Error('Failed to load projects');
        
        const projects = await response.json();
        const loadingState = document.getElementById('loading');
        
        const listingItems = projects.map(project => {
          const slug = projectSlugs[project.title];
          return {
            href: slug ? `p5js/${slug}.html` : '',
            title: project.title,
            image: projectImageOverrides[project.title] || project.img,
            video: projectVideoOverrides[project.title] || '',
            description: projectDescriptions[project.title] || '',
            tag: `${project.year} | p5.js`
          };
        });

        window.renderWorkListing({
          containerId: 'design-grid',
          loadingId: 'loading',
          items: listingItems
        });
        
      } catch (error) {
        console.error('Error loading projects:', error);
        document.getElementById('loading').innerHTML = 'Failed to load projects.';
      }
    }

    // Load projects when page loads
    document.addEventListener('DOMContentLoaded', loadP5jsProjects);
  </script>
</body>
</html>
