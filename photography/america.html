<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empty America | Suyash Chitrakar</title>
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="stylesheet" href="../assets/css/photography-project.css">
  <link rel="icon" type="image/png" href="../assets/img/circle-128.png">
</head>
<body class="photo-project-page" data-site-root=".." data-site-section="photography">

  <div class="photo-project-layout">
    <aside class="photo-sidebar">
      <div id="photo-sidebar-nav" class="photo-sidebar-nav"></div>
    </aside>

    <main class="photo-main">
      <h1 class="photo-project-title">Empty America</h1>
      <p class="photo-project-desc">A study on America's society, modern culture and religion. </p>

      <div class="photo-grid" id="photo-grid"></div>
    </main>
  </div>

  <div id="photo-lightbox" class="photo-lightbox">
    <button class="photo-lightbox-close" id="photo-lightbox-close">&times;</button>
    <button class="photo-lightbox-prev" id="photo-lightbox-prev">&#8249;</button>
    <img id="photo-lightbox-img" class="photo-lightbox-img" src="" alt="">
    <button class="photo-lightbox-next" id="photo-lightbox-next">&#8250;</button>
  </div>

  <script src="../assets/js/site-header.js"></script>
  <script src="../assets/js/header-dropdown.js"></script>
  <script src="../assets/js/photo-sidebar.js"></script>
  <script src="../assets/js/photography-grid.js"></script>
  <script>
    (function () {
      var folder = '../assets/img/photography/america/';
      var images = [
        'ununited-04.jpg', 'ununited-06.jpg', 'ununited-07.jpg', 'ununited-08.jpg', 'ununited-13.jpg',
        'ununited-15.jpg', 'ununited-16.jpg', 'ununited-17.jpg', 'ununited-19.jpg',
        'ununited-20.jpg', 'ununited-22.jpg', 'ununited-23.jpg', 'ununited-24.jpg',
        'ununited-27.jpg', 'ununited-28.jpg', 'ununited-29.jpg', 'ununited-30.jpg',
        'ununited-31.jpg', 'ununited-32.jpg', 'ununited-33.jpg', 'ununited-36.jpg',
        'ununited-40.jpg', 'ununited-41.jpg', 'ununited-43.jpg',
        'ununited-44.jpg', 'ununited-45.jpg', 'ununited-46.jpg', 'ununited-48.jpg', 'ununited-53.jpg',
        'ununited-54.jpg', 'ununited-55.jpg', 'ununited-58.jpg', 'ununited-59.jpg',
        'ununited-60.jpg', 'ununited-63.jpg'
      ];

      var grid = document.getElementById('photo-grid');
      images.forEach(function (name) {
        var img = document.createElement('img');
        img.src = folder + name;
        img.alt = 'Empty America — ' + name;
        img.className = 'photo-grid-img';
        img.loading = 'lazy';
        grid.appendChild(img);
      });
    }());
  </script>
</body>
</html>
