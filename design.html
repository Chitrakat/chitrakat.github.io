<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design | Suyash Chitrakar</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="icon" type="image/png" href="./assets/img/circle-128.png">
</head>
<body class="work-list-page fixed-intro" data-site-root="." data-site-section="design">
  
  <main class="work-list-main">
    <section class="work-list-intro">
      <nav class="work-list-desktop-nav" aria-label="Work categories">
        <a href="about.html">about</a>
        <a href="design.html" aria-current="page">publications</a>
        <a href="photography.html">photography</a>
        <a href="motion.html">motion</a>
        <a href="product-design.html">product design</a>
        <a href="image-making.html">image making</a>
        <a href="poster.html">poster</a>
      </nav>
      <div class="work-list-mobile-copy">
        <h1 class="work-list-title">Publication Design</h1>
        <p class="work-list-subtitle">Books, literary journals, and editorial designs shaped through layout, typography, and sequencing.</p>
      </div>
    </section>
    <div id="loading" class="loading-state">Loading projects...</div>
    <section id="design-grid" class="work-list-rows"></section>
  </main>

  <script src="assets/js/work-listings.js"></script>
  <script src="assets/js/site-header.js"></script>
  <script src="assets/js/header-dropdown.js"></script>
  
  <script>
    // Project slug mapping for URLs
    const projectSlugs = {
      'Catch Magazine VOL. 57 NO.2': 'vol57-2',
      'Catch Magazine: VOL. 55 NO. 2': 'vol55-2',
      'Catch Magazine: VOL. 56 NO. 1': 'vol56-1', 
      'Catch Magazine: VOL. 56 NO. 2': 'vol56-2',
      'X-JOURNAL': 'x-journal',
      'Lines in The Shed, Ryan Tracy': 'lines'
    };

    // Cover image mapping
    const coverImages = {
      'Catch Magazine VOL. 57 NO.2': 'assets/img/design-cover/catch-vol57-2-1.jpg',
      'Catch Magazine: VOL. 55 NO. 2': 'assets/img/design-cover/vol55-2.png',
      'Catch Magazine: VOL. 56 NO. 1': 'assets/img/design-cover/vol56-1.png',
      'Catch Magazine: VOL. 56 NO. 2': 'assets/img/design-cover/vol56-2.png', 
      'X-JOURNAL': 'assets/img/design-cover/x.png',
      'Lines in The Shed, Ryan Tracy': 'assets/img/design-cover/lines.jpg'
    };

    const designDescriptions = {
      'Catch Magazine VOL. 57 NO.2': 'A cyanotype-led Catch issue built from found natural materials and perforated postcard inserts.',
      'Catch Magazine: VOL. 55 NO. 2': 'Publication design, typography and spreads for a literary issue built around risograph textures.',
      'Catch Magazine: VOL. 56 NO. 1': 'Publication design balancing scanner-based imagery and editorial hierarchy.',
      'Catch Magazine: VOL. 56 NO. 2': 'A postcard-format issue exploring unbound reading and circulation.',
      'X-JOURNAL': 'A journal design documenting Knox College\'s creative output.',
      'Lines in The Shed, Ryan Tracy': 'A poetry book whose visual identity grows out of decay, label-maker typography, and object-making.'
    };

    async function loadDesignProjects() {
      try {
        const response = await fetch('design-popup/carousel-data.json');
        if (!response.ok) throw new Error('Failed to load projects');
        
        const projects = await response.json();
        const loadingState = document.getElementById('loading');
        
        const listingItems = projects.map(project => {
          const slug = projectSlugs[project.title];
          const coverImage = coverImages[project.title];
          return {
            href: slug ? `design/${slug}.html` : '',
            title: project.title,
            image: coverImage,
            description: designDescriptions[project.title] || '',
            tag: `${project.year} | ${project.kind}`
          };
        });

        window.renderWorkListing({
          containerId: 'design-grid',
          loadingId: 'loading',
          items: listingItems
        });
        
      } catch (error) {
        console.error('Error loading projects:', error);
        document.getElementById('loading').innerHTML = 'Failed to load projects.';
      }
    }

    // Load projects when page loads
    document.addEventListener('DOMContentLoaded', loadDesignProjects);
  </script>
</body>
</html>
